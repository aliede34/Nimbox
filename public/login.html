<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Nimbox - Giriş</title>
  <link rel="stylesheet" href="/css/style.css">
  <link rel="stylesheet" href="/css/auth.css">
  <link rel="icon" type="image/svg+xml" href="/logo.svg">
</head>
<body>
  <div class="auth-container">
    <div class="auth-card">
      <div class="auth-header">
        <img src="/logo.svg" alt="Nimbox" width="60" height="60">
        <h1>Nimbox</h1>
        <p>Hesabınıza giriş yapın</p>
      </div>
      <form id="login-form" onsubmit="handleLogin(event)">
        <div class="form-group">
          <label for="login-email">Email</label>
          <input type="email" id="login-email" placeholder="email@example.com" required>
        </div>
        <div class="form-group">
          <label for="login-password">Şifre</label>
          <input type="password" id="login-password" placeholder="••••••••" required>
        </div>
        <button type="submit" class="btn-auth">Giriş Yap</button>
      </form>
      <div class="auth-divider">
        <span>veya</span>
      </div>
      <p class="auth-switch">Hesabınız yok? <a href="/register">Kayıt olun</a></p>
      <div id="login-error" class="auth-error" style="display:none"></div>
    </div>
  </div>
  <script src="/js/auth.js"></script>
</body>
</html>
