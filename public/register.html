<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Nimbox - Kayıt Ol</title>
  <link rel="stylesheet" href="/css/style.css">
  <link rel="stylesheet" href="/css/auth.css">
  <link rel="icon" type="image/svg+xml" href="/logo.svg">
</head>
<body>
  <div class="auth-container">
    <div class="auth-card">
      <div class="auth-header">
        <img src="/logo.svg" alt="Nimbox" width="60" height="60">
        <h1>Nimbox</h1>
        <p>Ücretsiz hesap oluşturun</p>
      </div>
      <form id="register-form" onsubmit="handleRegister(event)">
        <div class="form-group">
          <label for="reg-username">Kullanıcı Adı</label>
          <input type="text" id="reg-username" placeholder="kullanici_adı" required minlength="3" maxlength="50">
        </div>
        <div class="form-group">
          <label for="reg-email">Email</label>
          <input type="email" id="reg-email" placeholder="email@example.com" required>
        </div>
        <div class="form-group">
          <label for="reg-password">Şifre</label>
          <input type="password" id="reg-password" placeholder="en az 6 karakter" required minlength="6">
        </div>
        <div class="form-group">
          <label for="reg-confirm">Şifre Tekrar</label>
          <input type="password" id="reg-confirm" placeholder="Şifreyi tekrardan girin" required minlength="6">
        </div>
        <button type="submit" class="btn-auth">Kayıt Ol</button>
      </form>
      <div class="auth-divider">
        <span>veya</span>
      </div>
      <p class="auth-switch">Zaten hesabınız var? <a href="/login">Giriş yapın</a></p>
      <div id="register-error" class="auth-error" style="display:none"></div>
    </div>
  </div>
  <script src="/js/auth.js"></script>
</body>
</html>
